name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, fileinfo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find src tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHPUnit
        # Integration tests (TimeEntryRepository, AuditLogMiddleware,
        # cross-tenant ListAction) skip without TDS_TEST_DB_DSN. The
        # pure-unit subset (DocumentSigner, BaseAction,
        # AdminAuthMiddleware, JwksAuthMiddleware) still runs.
        run: composer test
